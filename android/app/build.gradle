plugins {
    id 'com.android.application'
}

android {
    namespace 'at.macrobandit.app'
    compileSdk 35

    defaultConfig {
        applicationId 'at.macrobandit.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    dependenciesInfo {
        // F-Droid: keine verschlüsselten Abhängigkeits-Metadaten im APK
        includeInApk = false
        includeInBundle = false
    }
}
