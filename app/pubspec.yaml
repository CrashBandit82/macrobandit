name: macrobandit
description: "MacroBandit – offline macro and calorie tracker for Android, no account needed."
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_zxing: ^3.1.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  path_provider: ^2.1.6
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png
    - assets/bls.tsv

# Compile SQLite from source (tool/fetch-sqlite.sh) instead of downloading
# a prebuilt library – required for F-Droid, used for all builds.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c
