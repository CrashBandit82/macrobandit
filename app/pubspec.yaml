name: macrobandit
description: "MacroBandit – native Android app for the free macro and calorie tracker macrobandit.at."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_zxing: ^3.1.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png
